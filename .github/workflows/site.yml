name: Site du clan

on:
  schedule:
    # Complète, fiches des joueurs comprises.
    - cron: "17 4 * * *"
    # Légère : classement, parties et membres, avec les fiches de la dernière complète.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      profils:
        description: "Retélécharger les fiches des joueurs"
        type: boolean
        default: true
  # Le bot du Discord envoie son classement, comptes liés seulement.
  repository_dispatch:
    types: [classement-discord]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Membres du clan
        run: node scripts/fetch-members.mjs
      - name: Fiches de la dernière mise à jour complète
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/profiles.json
          key: profils-${{ github.run_id }}
          restore-keys: profils-
      # Sans fiches en cache, même une mise à jour légère les retélécharge.
      - name: Profils publics
        id: profils
        if: github.event.schedule == '17 4 * * *' || inputs.profils || github.event.client_payload.profils || steps.cache.outputs.cache-matched-key == ''
        run: node scripts/fetch-profiles.mjs
      - name: Garder les fiches pour les mises à jour légères
        if: steps.profils.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/profiles.json
          key: profils-${{ github.run_id }}
      # Le classement du bot n'entre pas dans le dépôt : il est gardé dans le cache, comme les fiches.
      - name: Classement Discord envoyé par le bot
        if: github.event_name == 'repository_dispatch'
        env:
          CLASSEMENT: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$CLASSEMENT" > data/discord.json
      - name: Garder le classement Discord
        if: github.event_name == 'repository_dispatch'
        uses: actions/cache/save@v4
        with:
          path: data/discord.json
          key: discord-${{ github.run_id }}
      - name: Dernier classement Discord
        if: github.event_name != 'repository_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/discord.json
          key: discord-${{ github.run_id }}
          restore-keys: discord-
      - name: Classement et parties
        run: node scripts/fetch-data.mjs
      - name: Construction du site
        run: |
          node scripts/build.mjs
          rm public/artifact.html
      # Une mise à jour part du commit qui l'a lancée : on ajoute le point du jour au dernier main,
      # sinon le push est refusé quand une autre mise à jour a écrit l'historique entre-temps.
      - name: Historique du classement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            node scripts/update-history.mjs
            git add data/history.json
            if git diff --cached --quiet; then ok=1; break; fi
            git commit --quiet -m "Historique du classement"
            if git push --quiet origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
