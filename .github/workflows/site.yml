name: Site du clan

on:
  schedule:
    # Complète, fiches des joueurs comprises.
    - cron: "17 4 * * *"
    # Légère : classement, parties et membres, avec les fiches de la dernière complète.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      profils:
        description: "Retélécharger les fiches des joueurs"
        type: boolean
        default: true
      minutes:
        description: "Minutes de relevé des parties par équipes (pour remonter le passé plus vite)"
        type: number
        default: 20
  # Le bot du Discord envoie son classement, comptes liés seulement.
  repository_dispatch:
    types: [classement-discord]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Les fiches (complète), le rattrapage des speedruns et celui des parties par équipes prennent chacun jusqu'à 20 ou
    # 25 minutes, l'ELO jusqu'à 10, les pseudos des joueurs classés jusqu'à 15.
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Membres du clan
        run: node scripts/fetch-members.mjs
      - name: Fiches de la dernière mise à jour complète
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/profiles.json
          key: profils-${{ github.run_id }}
          restore-keys: profils-
      # Sans fiches en cache, même une mise à jour légère les retélécharge.
      - name: Profils publics
        id: profils
        if: github.event.schedule == '17 4 * * *' || inputs.profils || github.event.client_payload.profils || steps.cache.outputs.cache-matched-key == ''
        run: node scripts/fetch-profiles.mjs
      - name: Garder les fiches pour les mises à jour légères
        if: steps.profils.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/profiles.json
          key: profils-${{ github.run_id }}
      # Le classement du bot n'entre pas dans le dépôt : il est gardé dans le cache, comme les fiches.
      - name: Classement Discord envoyé par le bot
        if: github.event_name == 'repository_dispatch'
        env:
          CLASSEMENT: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$CLASSEMENT" > data/discord.json
      - name: Garder le classement Discord
        if: github.event_name == 'repository_dispatch'
        uses: actions/cache/save@v4
        with:
          path: data/discord.json
          key: discord-${{ github.run_id }}
      - name: Dernier classement Discord
        if: github.event_name != 'repository_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/discord.json
          key: discord-${{ github.run_id }}
          restore-keys: discord-
      - name: Classement et parties
        run: node scripts/fetch-data.mjs
      # Les speedruns du clan : chaque relevé reprend où le précédent s'est arrêté. Il garde les identifiants des
      # joueurs, donc il reste dans le cache, pas dans le dépôt, avec les vignettes des cartes déjà téléchargées.
      # Une panne ne bloque pas le site : le relevé précédent sert.
      - name: Dernier relevé des speedruns
        uses: actions/cache/restore@v4
        with:
          path: |
            data/speedruns.json
            data/maps
          key: speedruns-${{ github.run_id }}
          restore-keys: speedruns-
      - name: Speedruns du clan
        id: speedruns
        continue-on-error: true
        run: node scripts/fetch-speedruns.mjs
      - name: Garder le relevé des speedruns
        if: steps.speedruns.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/speedruns.json
            data/maps
          key: speedruns-${{ github.run_id }}
      # L'ELO des membres sur TeamStats : seules les fiches des joueurs qui ont joué depuis la dernière fois sont relues.
      # Il garde les identifiants des joueurs, donc il reste dans le cache. Une panne ne bloque pas le site.
      - name: Dernier relevé de l'ELO
        uses: actions/cache/restore@v4
        with:
          path: data/elo.json
          key: elo-${{ github.run_id }}
          restore-keys: elo-
      - name: ELO des membres sur TeamStats
        id: elo
        continue-on-error: true
        run: node scripts/fetch-elo.mjs
      - name: Garder le relevé de l'ELO
        if: steps.elo.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/elo.json
          key: elo-${{ github.run_id }}
      # La cote en équipe : toutes les parties publiques par équipes, un fichier par jour fini, gardé dans le cache (il
      # contient les identifiants de tous les joueurs). Le relevé remonte au 1er septembre, du plus récent au plus ancien, en
      # quelques mises à jour ; la cote n'utilise un mois que quand il est complet. Elle se recalcule en quelques secondes.
      - name: Dernières parties par équipes relevées
        uses: actions/cache/restore@v4
        with:
          path: data/parties
          key: parties-${{ github.run_id }}
          restore-keys: parties-
      - name: Parties par équipes
        id: parties
        continue-on-error: true
        env:
          COTE_MINUTES: ${{ inputs.minutes || 20 }}
        run: node scripts/fetch-team-games.mjs
      # Même si le relevé s'arrête sur une erreur : chaque jour fini est déjà écrit en entier.
      - name: Garder les parties par équipes
        if: steps.parties.outcome == 'success' || steps.parties.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: data/parties
          key: parties-${{ github.run_id }}
      # Les pseudos des joueurs classés (seuls ceux qui en ont un public prennent un rang mondial) : leur cache est sauvé
      # après le calcul de la cote, qui les lit et les complète.
      - name: Pseudos des joueurs classés
        uses: actions/cache/restore@v4
        with:
          path: data/noms
          key: noms-${{ github.run_id }}
          restore-keys: noms-
      - name: Cote en équipe
        continue-on-error: true
        run: node scripts/cote.mjs
      - name: Garder les pseudos des joueurs classés
        if: hashFiles('data/noms/noms.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/noms
          key: noms-${{ github.run_id }}
      - name: Construction du site
        run: |
          node scripts/build.mjs
          rm public/artifact.html
      # Une mise à jour part du commit qui l'a lancée : on ajoute le point du jour au dernier main,
      # sinon le push est refusé quand une autre mise à jour a écrit l'historique entre-temps.
      - name: Historique du classement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            node scripts/update-history.mjs
            git add data/history.json
            if git diff --cached --quiet; then ok=1; break; fi
            git commit --quiet -m "Historique du classement"
            if git push --quiet origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
